<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101210"><meta name="description" content="찍고, 터치하고, 산산조각. 손끝에서 시작하는 모바일 파괴 실험실."><title>SnapSmash · 찍고깨</title><style>
:root{color-scheme:dark;--lime:#d6ff62;--muted:#8b9386}*{box-sizing:border-box}body{margin:0;background:#090b09;color:#f5f6f0;font-family:Arial,'Apple SD Gothic Neo',sans-serif;height:100dvh;overflow:hidden;overscroll-behavior:none}button{font:inherit;color:inherit;cursor:pointer;border:0;touch-action:manipulation}button:focus-visible{outline:2px solid var(--lime);outline-offset:3px}.app{height:100%;max-width:500px;margin:auto;padding: max(18px,env(safe-area-inset-top)) 22px max(16px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:17px;background:#101210}header{display:flex;align-items:center;justify-content:space-between}.brand{font-size:23px;letter-spacing:-1.3px;font-weight:950}.brand i{color:var(--lime);font-style:normal}.tag{font:10px monospace;letter-spacing:1.5px;color:var(--muted)}.sound{width:40px;height:40px;border:1px solid #343a30;background:transparent;border-radius:50%;font-size:18px}.intro{display:flex;justify-content:space-between;align-items:end}h1{font-size:29px;letter-spacing:-1.5px;line-height:1.2;margin:0}.intro p{font-size:11px;color:var(--muted);line-height:1.6;margin:0;text-align:right}.modes{display:flex;background:#1b1f19;border-radius:12px;padding:4px;gap:4px}.modes button{flex:1;padding:11px;border-radius:9px;background:transparent;color:#9ca393;font-size:13px}.modes button[aria-pressed=true]{background:var(--lime);color:#1b2411;font-weight:800}.modes small{font-size:9px;margin-left:7px;letter-spacing:1px;opacity:.6}.stage{position:relative;min-height:140px;flex:1;border:1px solid #394032;border-radius:17px;overflow:hidden;background:#1c211a;touch-action:none;isolation:isolate}canvas{width:100%;height:100%;display:block;touch-action:none}.stage-top{position:absolute;top:15px;left:15px;right:15px;display:flex;justify-content:space-between;pointer-events:none;font:9px monospace;letter-spacing:1.4px;color:#dae5c9}.live:before{content:'';display:inline-block;width:5px;height:5px;background:var(--lime);border-radius:50%;margin-right:6px}.hint{position:absolute;bottom:22px;width:100%;text-align:center;pointer-events:none}.hint span{display:inline-block;font-size:12px;background:#13170fb8;backdrop-filter:blur(6px);border:1px solid #586145;padding:10px 16px;border-radius:30px}.cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:var(--lime);font-size:34px;pointer-events:none;font-weight:200}.stats{display:flex;justify-content:space-between;align-items:center}.count{font:11px monospace;color:var(--muted)}.count strong{font-size:22px;color:#f5f6f0;margin-right:6px}.reset{padding:9px 12px;background:#21261d;border:1px solid #343c2e;border-radius:8px;font-size:12px}.actions{display:flex;gap:9px}.camera{flex:1;background:var(--lime);color:#202713;padding:17px 10px;border-radius:12px;font-size:15px;font-weight:800}.gallery{width:57px;border-radius:12px;background:#262c22;font-size:22px}.foot{display:flex;justify-content:space-between;font-size:9px;color:#89917f;gap:5px}.foot .dot{color:var(--lime)}.toast{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);padding:13px 20px;border-radius:12px;background:#10150feb;text-align:center;font-size:12px;pointer-events:none;opacity:0;transition:opacity .2s;max-width:90%;width:max-content}.toast.show{opacity:1}input{display:none}@media(min-width:600px){body{display:grid;place-items:center;background:radial-gradient(ellipse at center,#242c1b,#090b09 65%)}.app{height:min(900px,96dvh);width:430px;border:1px solid #30372a;border-radius:28px;padding:24px;box-shadow:0 20px 100px #0008}}@media(max-height:700px){.app{gap:11px}h1{font-size:24px}.camera{padding:14px}.intro p{font-size:10px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head><body><main class="app"><header><div><div class="brand">SnapSmash<i>✳</i></div><span class="tag">찍고깨 · POCKET SMASH LAB</span></div><button class="sound" id="sound" aria-label="타격음 끄기" aria-pressed="true">♪</button></header><section class="intro"><h1>찍고깨.<br>톡, 쩍, 와르르.</h1><p>스트레스는 내려놓고<br>손끝의 감각에 집중하세요.</p></section><div class="modes" role="group" aria-label="파편 재질"><button aria-pressed="true" data-mode="glass">◇ 유리<small>GLASS</small></button><button aria-pressed="false" data-mode="concrete">▧ 콘크리트<small>CONCRETE</small></button></div><div class="stage" id="stage"><canvas id="view" aria-label="사진 파괴 체험 영역. 화면을 터치하세요."></canvas><div class="stage-top"><span class="live" id="status">DEMO OBJECT</span><span id="material">01 / GLASS</span></div><div class="cross" id="cross">⌖</div><div class="hint" id="hint"><span>같은 곳을 여러 번 두드려 보세요 ↗</span></div><div class="toast" id="toast" role="status"></div></div><div class="stats"><div class="count"><strong id="hits">00</strong> HITS <span style="margin-left:13px" id="pieces">여러 번 톡톡</span></div><button class="reset" id="reset">↻ 다시 복원</button></div><div class="actions"><button class="camera" id="camera">◎ &nbsp; 카메라로 촬영하기</button><button class="gallery" id="gallery" aria-label="앨범에서 사진 선택">▧</button></div><div class="foot"><span><span class="dot">●</span> 사진은 기기 안에서만 처리됩니다</span><span id="haptic">햅틱 확인 중</span></div><input type="file" id="capture" accept="image/*" capture="environment"><input type="file" id="album" accept="image/*"></main><script>
'use strict';
const $=id=>document.getElementById(id),cv=$('view'),ctx=cv.getContext('2d'),stage=$('stage'),surface=document.createElement('canvas'),sc=surface.getContext('2d');let w=0,h=0,dpr=1,photo=null,cells=[],mode='glass',hits=0,sound=true,audio=null,shake=0,frame=0,last=0,flash=0,rings=[],combo=0,lastHit=-Infinity;const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function notify(s){$('toast').textContent=s;$('toast').classList.add('show');clearTimeout(notify.t);notify.t=setTimeout(()=>$('toast').classList.remove('show'),2400)}
function sample(){sc.fillStyle='#343e30';sc.fillRect(0,0,w,h);const g=sc.createLinearGradient(0,0,w,h);g.addColorStop(0,'#657355');g.addColorStop(1,'#242b21');sc.fillStyle=g;sc.fillRect(0,0,w,h);sc.save();sc.translate(w*.5,h*.49);sc.rotate(-.13);const a=Math.min(w*.7,h*.67);sc.shadowColor='#0008';sc.shadowBlur=35;sc.shadowOffsetY=18;sc.fillStyle='#e1e6d2';sc.fillRect(-a/2,-a*.56,a,a*1.12);sc.shadowColor='transparent';sc.strokeStyle='#83916d';sc.lineWidth=1;for(let i=0;i<9;i++){sc.beginPath();sc.moveTo(-a/2+14,-a*.56+20+i*a*.105);sc.lineTo(a/2-14,-a*.56+20+i*a*.105);sc.stroke()}sc.fillStyle='#26361f';sc.font='900 '+a*.17+'px Arial';sc.textAlign='center';sc.fillText('BREAK',0,-a*.13);sc.fillText('THE',0,a*.08);sc.fillText('TENSION.',0,a*.29);sc.font='9px monospace';sc.fillText('JUST A LITTLE RELEASE.',0,a*.46);sc.restore()}
function paint(){surface.width=Math.ceil(w*dpr);surface.height=Math.ceil(h*dpr);sc.setTransform(dpr,0,0,dpr,0,0);if(photo){const z=Math.max(w/photo.width,h/photo.height);sc.drawImage(photo,(w-photo.width*z)/2,(h-photo.height*z)/2,photo.width*z,photo.height*z)}else sample()}
function clip(poly,a,b){const dx=b.x-a.x,dy=b.y-a.y,k=(b.x*b.x+b.y*b.y-a.x*a.x-a.y*a.y)/2,out=[];for(let i=0;i<poly.length;i++){const p=poly[i],q=poly[(i+1)%poly.length],u=p.x*dx+p.y*dy-k,v=q.x*dx+q.y*dy-k;if(u<=0)out.push(p);if((u<=0)!=(v<=0)){const t=u/(u-v);out.push({x:p.x+(q.x-p.x)*t,y:p.y+(q.y-p.y)*t})}}return out}
function fracture(cx=w/2,cy=h/2){const seeds=[];for(let i=0;i<88;i++)seeds.push({x:Math.random()*w,y:Math.random()*h});for(let i=0;i<22;i++){let a=Math.random()*Math.PI*2,r=Math.random()*Math.min(w,h)*.28;seeds.push({x:Math.max(0,Math.min(w,cx+Math.cos(a)*r)),y:Math.max(0,Math.min(h,cy+Math.sin(a)*r))})}cells=seeds.map(s=>{let p=[{x:0,y:0},{x:w,y:0},{x:w,y:h},{x:0,y:h}];for(const b of seeds){if(b!==s)p=clip(p,s,b);if(!p.length)break}return {p,x:s.x,y:s.y,dx:0,dy:0,vx:0,vy:0,r:0,vr:0,z:1,vz:0,life:1,active:false,damage:0,area:Math.abs(p.reduce((sum,v,i)=>{const q=p[(i+1)%p.length];return sum+v.x*q.y-q.x*v.y},0))/2}})}
function reset(){if(frame)cancelAnimationFrame(frame);frame=0;hits=0;cells=[];rings=[];combo=0;lastHit=-Infinity;shake=0;flash=0;$('hits').textContent='00';$('pieces').textContent='여러 번 톡톡';$('hint').style.display='block';$('cross').style.display='block';draw()}
function resize(){const r=stage.getBoundingClientRect();w=r.width;h=r.height;dpr=Math.min(devicePixelRatio||1,2);cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);paint();reset()}
function noise(broken=false){if(!sound)return;try{audio ||= new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const t=audio.currentTime,o=audio.createOscillator(),gain=audio.createGain();o.type='triangle';o.frequency.setValueAtTime(broken?(mode==='glass'?175:95):115,t);o.frequency.exponentialRampToValueAtTime(30,t+.16);gain.gain.setValueAtTime(.55,t);gain.gain.exponentialRampToValueAtTime(.001,t+.22);o.connect(gain).connect(audio.destination);o.start(t);o.stop(t+.23);const dur=broken?(mode==='glass'?.55:.3):.1,b=audio.createBuffer(1,Math.floor(audio.sampleRate*dur),audio.sampleRate),arr=b.getChannelData(0);for(let i=0;i<arr.length;i++)arr[i]=(Math.random()*2-1)*Math.pow(1-i/arr.length,2);const n=audio.createBufferSource(),f=audio.createBiquadFilter(),g=audio.createGain();n.buffer=b;f.type=mode==='glass'?'highpass':'lowpass';f.frequency.value=mode==='glass'?2400:750;g.gain.value=broken?.27:.09;n.connect(f).connect(g).connect(audio.destination);n.start(t)}catch(e){notify('이 브라우저에서는 소리를 사용할 수 없어요')}}
function strike(x,y){
 if(!cells.length)fracture(x,y);
 const intact=cells.filter(c=>!c.active&&c.p.length);
 if(!intact.length){notify('모두 깨뜨렸어요! 복원해서 다시 시작하세요');return}
 hits++;const now=performance.now();combo=now-lastHit<700?combo+1:1;lastHit=now;
 $('hits').textContent=String(hits).padStart(2,'0');$('hint').style.display='none';$('cross').style.display='none';
 const base=Math.max(55,Math.min(w,h)*(mode==='glass'?.23:.19));
 // Expand through an existing hole to its nearest remaining edge.
 const nearest=Math.min(...intact.map(c=>Math.hypot(c.x-x,c.y-y)));
 const radius=Math.max(base,nearest+24),threshold=mode==='glass'?2.6:3.7;let launched=0;
 for(const c of intact){const dist=Math.hypot(c.x-x,c.y-y);if(dist>radius)continue;
 c.damage+=Math.max(.48,1.2*(1-dist/(radius*1.6)));
 if(c.damage<threshold)continue;
 c.active=true;const a=Math.atan2(c.y-y,c.x-x),force=(mode==='glass'?130:90)+Math.random()*180;
 c.vx=Math.cos(a)*force;c.vy=Math.sin(a)*force-150;c.vr=(Math.random()-.5)*5;c.vz=.12+Math.random()*.5;launched++;
 }
 const brokenArea=cells.reduce((a,c)=>a+(c.active?c.area:0),0),percent=Math.min(100,Math.round(brokenArea/(w*h)*100));
 $('pieces').textContent=percent===100?'완전 파괴! ↻':(combo>1?combo+'연타 · ':'')+percent+'% 파괴';
 noise(launched>0);if(navigator.vibrate)navigator.vibrate(launched?[35,15,55]:[18]);
 shake=reduced?0:(launched?13:6+Math.min(combo,5));flash=launched?.12:.045;
 rings.push({x,y,life:1,broken:launched>0});if(rings.length>8)rings.shift();start();
}
function path(c){ctx.beginPath();c.p.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath()}
function draw(dt=0){ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);ctx.save();if(shake){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.8;if(shake<.2)shake=0}if(!cells.length)ctx.drawImage(surface,0,0,w,h);else for(const c of cells){if(c.life<=0||!c.p.length)continue;if(c.active&&dt){c.vy+=650*dt;c.dx+=c.vx*dt;c.dy+=c.vy*dt;c.r+=c.vr*dt;c.z+=c.vz*dt;c.life-=dt*.38}ctx.save();ctx.globalAlpha=Math.max(0,c.life);ctx.translate(c.x+c.dx,c.y+c.dy);ctx.rotate(c.r);ctx.scale(c.z,reduced?c.z:c.z*Math.max(.15,Math.abs(Math.cos(c.r*.8))));ctx.translate(-c.x,-c.y);path(c);ctx.save();ctx.clip();ctx.drawImage(surface,0,0,w,h);if(mode==='concrete'){ctx.fillStyle='#665e4c33';ctx.fillRect(0,0,w,h)}ctx.restore();if(c.active||c.damage>0){ctx.strokeStyle=mode==='glass'?'#ebffd6':'#332d24';ctx.globalAlpha=Math.min(1,c.damage/(mode==='glass'?2.6:3.7))*.85;ctx.lineWidth=mode==='glass'?1:2;ctx.stroke();
 if(!c.active){ctx.save();path(c);ctx.clip();ctx.beginPath();ctx.moveTo(c.x,c.y);for(let j=0;j<Math.min(c.p.length,Math.ceil(c.damage*2));j++){const p=c.p[j];ctx.moveTo(c.x,c.y);ctx.lineTo((c.x+p.x)/2+3,(c.y+p.y)/2-3);ctx.lineTo(p.x,p.y)}ctx.lineWidth=.75;ctx.stroke();ctx.restore()}}ctx.restore()}ctx.restore();for(const ring of rings){ring.life-=dt*3.5;ctx.save();ctx.globalAlpha=Math.max(0,ring.life)*.7;ctx.strokeStyle=ring.broken?'#d6ff62':'#f0ffda';ctx.lineWidth=ring.broken?2:1;ctx.beginPath();ctx.arc(ring.x,ring.y,reduced?13:10+(1-ring.life)*48,0,Math.PI*2);ctx.stroke();ctx.restore()}rings=rings.filter(r=>r.life>0);if(flash>0){ctx.fillStyle='rgba(230,255,200,'+flash+')';ctx.fillRect(0,0,w,h);flash*=.65}}
function tick(t){const dt=Math.min((t-last)/1000,.035);last=t;draw(dt);if(cells.some(c=>c.active&&c.life>0)||rings.length||shake||flash>.003)frame=requestAnimationFrame(tick);else frame=0}function start(){if(!frame){last=performance.now();frame=requestAnimationFrame(tick)}}
cv.addEventListener('pointerdown',e=>{e.preventDefault();const r=cv.getBoundingClientRect();strike(e.clientX-r.left,e.clientY-r.top)});stage.addEventListener('contextmenu',e=>e.preventDefault());$('reset').onclick=reset;document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',x===b));$('material').textContent=mode==='glass'?'01 / GLASS':'02 / CONCRETE';reset()});$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'♪':'♩̸';$('sound').setAttribute('aria-pressed',sound);$('sound').setAttribute('aria-label',sound?'타격음 끄기':'타격음 켜기')};$('camera').onclick=()=>$('capture').click();$('gallery').onclick=()=>$('album').click();async function load(e){const file=e.target.files[0];if(!file)return;notify('사진을 준비하고 있어요');const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{const small=document.createElement('canvas'),ratio=Math.min(1,1600/Math.max(img.width,img.height));small.width=Math.round(img.width*ratio);small.height=Math.round(img.height*ratio);small.getContext('2d').drawImage(img,0,0,small.width,small.height);photo=small;URL.revokeObjectURL(url);paint();reset();$('status').textContent='YOUR PHOTO';notify('준비됐어요. 같은 곳을 여러 번 두드려 보세요');e.target.value=''};img.onerror=()=>{URL.revokeObjectURL(url);notify('사진을 열 수 없어요. JPG 또는 PNG를 선택하세요');e.target.value=''};img.src=url}$('capture').onchange=load;$('album').onchange=load;$('haptic').textContent=navigator.vibrate?'햅틱 지원':'진동 미지원 · 소리로 즐기세요';new ResizeObserver(resize).observe(stage);document.addEventListener('visibilitychange',()=>{if(document.hidden){if(frame)cancelAnimationFrame(frame);frame=0;audio?.suspend()}else if(cells.length)start()});
</script></body></html>
